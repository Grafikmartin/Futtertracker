<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Bolle - Futter- & Gesundheitsprotokoll</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Futter- & Gesundheitsprotokoll für Bolle</h1>
  
  <!-- Formular für Dateneingabe -->
  <form id="entryForm">
    <!-- Datum -->
    <div class="form-group">
      <label for="entryDate">Datum:</label>
      <input type="date" id="entryDate" name="entryDate" required />
    </div>
    
    <!-- Futtertyp (Nass als Standard), leere Option für "keine Änderung"? 
         Du kannst auch direkt "nass" vorbelegen und immer überschreiben.
         Hier nutzen wir "", um optional kein Update zu machen. -->
    <div class="form-group">
      <label for="feedType">Futterart:</label>
      <select id="feedType" name="feedType">
        <option value="">(Keine Änderung)</option>
        <option value="nass" selected>Nass</option>
        <option value="trocken">Trocken</option>
        <option value="beides">Beides</option>
      </select>
    </div>
    
    <!-- Stuhlgang (1=Sehr gut, 5=Schlecht) -->
    <!-- Leer lassen => keine Änderung -->
    <div class="form-group">
      <label for="stoolQuality">Stuhlgang (1=Sehr gut, 5=Schlecht):</label>
      <input
        type="number"
        id="stoolQuality"
        name="stoolQuality"
        min="1"
        max="5"
        placeholder="z.B. 3"
      />
    </div>
    
    <!-- Erbrochen als Checkbox (ja/nein). 
         Überschreibt den bisherigen Wert immer. -->
    <div class="form-group">
      <label for="vomited">Erbrochen?</label>
      <input
        type="checkbox"
        id="vomited"
        name="vomited"
      />
    </div>
    
    <!-- Medikamente -->
    <div class="form-group">
      <label for="pantoprazolCount">Pantoprazol (20 mg/Tag):</label>
      <input
        type="number"
        id="pantoprazolCount"
        name="pantoprazolCount"
        min="0"
        max="10"
        placeholder="z.B. 1"
      />
    </div>
    
    <div class="form-group">
      <label for="sucrabestCount">Sucrabest (1 g/Tag):</label>
      <input
        type="number"
        id="sucrabestCount"
        name="sucrabestCount"
        min="0"
        max="10"
        placeholder="z.B. 2"
      />
    </div>

    <!-- Submit-Button -->
    <button type="submit">Daten speichern</button>
  </form>

  <!-- Diagramme: (1) Futter, (2) Stuhlgang, (3) Erbrochen, (4) Medikamente -->
  <div class="charts-container">
    <canvas id="feedChart"></canvas>
    <canvas id="stoolChart"></canvas>
    <canvas id="vomitChart"></canvas>
    <canvas id="medChart"></canvas>
  </div>

  <!-- Chart.js (Open Source, MIT-Lizenz) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Dein eigenes Skript -->
  <script src="script.js"></script>
</body>
</html>
